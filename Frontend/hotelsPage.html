<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WanderSmart — Hotels</title>
    <link rel="stylesheet" href="./hotels.css" />
  </head>
  <body>
    <!-- ── Navbar ───────────────────────────────────────────────── -->
    <nav class="navbar">
      <div class="nav-logo">Wander<span>Smart</span></div>
      <div class="nav-links">
        <a href="index.html">Explore</a>
        <a href="hotels.html" class="active">Hotels</a>
        <a href="tours.html">Tours</a>
        <a href="dashboard.html">Dashboard</a>
      </div>
      <button class="btn-primary nav-cta">Plan a Trip</button>
    </nav>

    <!-- ── Search band ──────────────────────────────────────────── -->
    <div class="search-band">
      <input
        id="search-destination"
        class="search-field"
        type="text"
        placeholder="Destination"
      />
      <input
        id="search-checkin"
        class="search-field"
        type="date"
        placeholder="Check-in"
      />
      <input
        id="search-checkout"
        class="search-field"
        type="date"
        placeholder="Check-out"
      />
      <input
        id="search-guests"
        class="search-field"
        type="number"
        placeholder="Guests"
        min="1"
        max="20"
      />
      <button class="btn-primary" id="search-btn">Search Hotels</button>
    </div>

    <!-- ── Main layout ──────────────────────────────────────────── -->
    <div class="layout">
      <!-- Sidebar filters -->
      <aside class="sidebar">
        <div class="sf-group">
          <div class="sf-title">Filters</div>
          <label class="sf-check">
            <input type="checkbox" id="f-eco" value="Eco-Certified" />
            <span class="checkmark"></span>
            Eco-Certified
            <span class="tag tag-green">Green</span>
          </label>
          <label class="sf-check">
            <input type="checkbox" id="f-gem" value="Hidden Gem" />
            <span class="checkmark"></span>
            Hidden Gems
            <span class="tag tag-amber">Unique</span>
          </label>
          <label class="sf-check">
            <input type="checkbox" id="f-deal" value="Hot Deal" />
            <span class="checkmark"></span>
            Hot Deals
            <span class="tag tag-coral">Sale</span>
          </label>
          <label class="sf-check">
            <input type="checkbox" id="f-cancel" value="Free Cancellation" />
            <span class="checkmark"></span>
            Free Cancellation
          </label>
          <label class="sf-check">
            <input type="checkbox" id="f-pool" value="Pool" />
            <span class="checkmark"></span>
            Pool Included
          </label>
        </div>

        <div class="sf-group">
          <div class="sf-title">Price per night</div>
          <div class="price-row">
            <span>&#8377;500</span>
            <span id="price-display">&#8377;8,000</span>
          </div>
          <input
            type="range"
            id="price-range"
            min="500"
            max="15000"
            value="8000"
            step="500"
          />
        </div>

        <div class="sf-group">
          <div class="sf-title">Star rating</div>
          <div class="star-row">
            <button class="star-btn" data-star="1">1&#9733;</button>
            <button class="star-btn" data-star="2">2&#9733;</button>
            <button class="star-btn" data-star="3">3&#9733;</button>
            <button class="star-btn" data-star="4">4&#9733;</button>
            <button class="star-btn" data-star="5">5&#9733;</button>
          </div>
        </div>

        <div class="sf-group">
          <div class="sf-title">Amenities</div>
          <label class="sf-check">
            <input type="checkbox" id="a-wifi" value="WiFi" />
            <span class="checkmark"></span> WiFi
          </label>
          <label class="sf-check">
            <input type="checkbox" id="a-breakfast" value="Breakfast" />
            <span class="checkmark"></span> Breakfast
          </label>
          <label class="sf-check">
            <input type="checkbox" id="a-parking" value="Parking" />
            <span class="checkmark"></span> Parking
          </label>
          <label class="sf-check">
            <input type="checkbox" id="a-gym" value="Gym" />
            <span class="checkmark"></span> Gym
          </label>
          <label class="sf-check">
            <input type="checkbox" id="a-spa" value="Spa" />
            <span class="checkmark"></span> Spa
          </label>
        </div>

        <button class="btn-apply" id="apply-filters">Apply Filters</button>
        <button class="btn-reset" id="reset-filters">Reset</button>
      </aside>

      <!-- Hotel listing -->
      <main class="main">
        <div class="result-bar">
          <span class="result-count" id="result-count">Loading hotels...</span>
          <select class="sort-sel" id="sort-select">
            <option value="best_value">Sort: Best value</option>
            <option value="price_asc">Price: Low to high</option>
            <option value="price_desc">Price: High to low</option>
            <option value="rating">Rating: Highest</option>
            <option value="eco_score">Eco score</option>
          </select>
        </div>

        <!-- Loading state -->
        <div id="loading" class="loading-state">Searching hotels...</div>

        <!-- Error state -->
        <div id="error-box" class="error-box" style="display: none">
          <p id="error-msg">Something went wrong. Please try again.</p>
        </div>

        <!-- Hotel cards container -->
        <div id="hotel-list" class="hotel-list"></div>

        <!-- Empty state -->
        <div id="no-results" class="no-results" style="display: none">
          <p>No hotels match your filters.</p>
          <button
            class="btn-reset"
            onclick="document.getElementById('reset-filters').click()"
          >
            Clear filters
          </button>
        </div>
      </main>
    </div>

    <!-- ── Hotel card template (cloned by JS) ───────────────────── -->
    <template id="hotel-card-tpl">
      <div class="hotel-card">
        <div class="hotel-thumb">
          <div class="thumb-placeholder"></div>
        </div>
        <div class="hotel-body">
          <div class="hotel-top">
            <div class="hotel-name-row">
              <span class="hotel-name"></span>
              <span class="hotel-rating"></span>
            </div>
            <div class="hotel-loc"></div>
            <div class="hotel-tags"></div>
            <div class="hotel-amenities"></div>
            <div class="eco-score-row">
              <div class="eco-leaves"></div>
              <span class="eco-label"></span>
            </div>
          </div>
          <div class="hotel-bottom">
            <div class="hotel-price-block">
              <div class="hotel-price"></div>
              <div class="hotel-price-sub"></div>
            </div>
            <button class="btn-book">Book Now</button>
          </div>
        </div>
      </div>
    </template>

    <script src="hotels.js"></script>
  </body>
</html>
